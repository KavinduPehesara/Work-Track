<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WorkTrack</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --navy:#101C2C; --navy-soft:#1B2A40;
  --paper:#F6F3EC; --card:#FFFFFF;
  --gold:#C8943D; --teal:#1F8A70; --red:#B6452C;
  --line:#E3DDCF; --ink:#101C2C; --ink-soft:#5B6573;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}

/* ── Gate / auth screens ── */
.gate{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:24px 20px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;width:100%;max-width:420px;}
.gate-card .logo{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--navy);margin:0 0 4px;}
.gate-card .tagline{color:var(--ink-soft);font-size:13px;margin-bottom:24px;}
.gate-card .note{color:var(--ink-soft);font-size:12px;line-height:1.6;margin-top:14px;}

.google-btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;
  background:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;
  color:var(--ink);cursor:pointer;transition:border-color .15s, box-shadow .15s;
}
.google-btn:hover{border-color:#aaa;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.google-btn:active{transform:scale(0.98);}
.google-btn svg{width:20px;height:20px;flex-shrink:0;}

/* ── App shell ── */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}
.topbar{background:var(--navy);color:#fff;padding:16px 18px 12px;padding-top:calc(16px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;}
.topbar .left .brand{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
.topbar .left .sub{font-size:10px;color:#A9B4C4;margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.5px;display:flex;align-items:center;gap:6px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#A9B4C4;display:inline-block;transition:background .3s;}
.sync-dot.live{background:#4ade80;}
.sync-dot.saving{background:var(--gold);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.topbar .right img{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);cursor:pointer;}
.topbar .right .avatar-ph{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;cursor:pointer;}

main{flex:1;padding:14px 14px 100px;}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.card h2{font-family:'Fraunces',serif;font-size:15px;margin:0 0 12px;font-weight:600;color:var(--navy);}

/* ── Hero ── */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-soft) 100%);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px;}
.hero .label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;color:#A9B4C4;text-transform:uppercase;}
.hero .big{font-family:'Fraunces',serif;font-size:36px;font-weight:600;margin:4px 0 2px;}
.hero .big small{font-size:17px;color:#9FB3CF;font-weight:400;}
.bar-track{background:rgba(255,255,255,0.15);border-radius:8px;height:10px;margin:12px 0 8px;overflow:hidden;}
.bar-fill{height:100%;background:var(--gold);border-radius:8px;transition:width .4s ease;}
.bar-fill.over{background:var(--red);}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.hero-cell .l{font-size:10px;color:#A9B4C4;font-family:'IBM Plex Mono',monospace;}
.hero-cell .v{font-family:'Fraunces',serif;font-size:18px;margin-top:2px;}

/* ── Stats ── */
.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);}
.stat-row:last-child{border-bottom:none;}
.stat-row .l{font-size:13px;color:var(--ink-soft);}
.stat-row .v{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}

/* ── Buttons ── */
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:transform .1s,opacity .15s;min-height:50px;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-clockin{background:var(--teal);color:#fff;}
.btn-clockout{background:var(--red);color:#fff;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
.btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

/* ── Form fields ── */
.field{margin-bottom:14px;}
.field label{font-size:12px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}
.field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:'Inter',sans-serif;font-size:16px;background:#fff;color:var(--ink);-webkit-appearance:none;transition:border-color .15s;}
.field input:focus,.field select:focus{outline:none;border-color:var(--navy);}
.field .err-msg{font-size:11.5px;color:var(--red);margin-top:4px;display:none;}
.field.has-err .err-msg{display:block;}
.field.has-err input,.field.has-err select{border-color:var(--red);background:#FDF1EE;}

.muted{color:var(--ink-soft);font-size:12.5px;}
.hidden{display:none !important;}

/* ── Pills ── */
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
.pill-paid{background:#E2F1EB;color:var(--teal);}
.pill-partial{background:#FBEFDD;color:var(--gold);}
.pill-unpaid{background:#F6E4DD;color:var(--red);}

/* ── Entry rows ── */
.entry-row{padding:11px 0;border-bottom:1px solid var(--line);}
.entry-row:last-child{border-bottom:none;}
.entry-row .d{font-weight:600;font-size:14px;}
.entry-row .t{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.entry-row .loc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;display:flex;align-items:center;gap:5px;}
.gps-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;flex-shrink:0;}
.gps-dot.off{background:#ccc;}

.week-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.week-card .head .wk{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}

.del-btn{background:none;border:none;color:var(--red);font-size:13px;cursor:pointer;padding:4px 8px;font-family:'Inter',sans-serif;font-weight:600;opacity:0.7;}
.del-btn:active{opacity:1;}

.clocked-in-banner{background:#E2F1EB;border:1px solid #B2D9CB;border-radius:12px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.clocked-in-banner .info .time{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--teal);}
.clocked-in-banner .info .sub{font-size:12px;color:#1F8A70;margin-top:2px;}

.tag-line{display:flex;gap:8px;align-items:center;margin-bottom:12px;}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(16,28,44,0.6);display:flex;align-items:flex-end;z-index:30;}
.modal{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:22px 18px;padding-bottom:calc(22px + env(safe-area-inset-bottom));}
.modal h3{font-family:'Fraunces',serif;margin:0 0 14px;font-size:18px;}

/* ── Nav ── */
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:10;}
nav button{background:none;border:none;font-family:'Inter',sans-serif;font-size:10px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1;padding:5px 0;min-height:44px;justify-content:center;}
nav button .ic{font-size:20px;line-height:1;}
nav button.active{color:var(--navy);font-weight:700;}

.empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13px;}

/* ── Toast ── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:50;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Loading spinner ── */
#loadingScreen{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#loadingScreen .brand{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--navy);margin-bottom:20px;}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Loading -->
<div id="loadingScreen">
  <div class="brand">WorkTrack</div>
  <div class="spinner"></div>
</div>

<!-- Sign-in -->
<div id="signInScreen" class="gate hidden">
  <div class="gate-card">
    <div class="logo">WorkTrack</div>
    <div class="tagline">Your personal payroll &amp; timesheet tracker</div>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
    <div id="signInError" class="hidden" style="margin-top:14px;font-size:13px;color:var(--red);text-align:center;"></div>
    <div class="note" style="text-align:center;">Your data is synced securely across all your devices.</div>
  </div>
</div>

<!-- Profile setup (first sign-in) -->
<div id="profileSetupScreen" class="gate hidden">
  <div class="gate-card">
    <div class="logo">Almost ready</div>
    <div class="tagline">Set your pay details to get started</div>
    <div class="field" id="f-setupName">
      <label>Your name</label>
      <input id="setupName" autocomplete="given-name">
      <div class="err-msg">Name is required</div>
    </div>
    <div class="field" id="f-setupRate">
      <label>Hourly rate (NZD)</label>
      <input id="setupRate" type="number" inputmode="decimal" placeholder="24">
      <div class="err-msg">Enter a rate greater than 0</div>
    </div>
    <div class="field" id="f-setupLimit">
      <label>Weekly allowed hours</label>
      <input id="setupLimit" type="number" inputmode="decimal" placeholder="25">
      <div class="err-msg">Enter hours greater than 0</div>
    </div>
    <div class="field">
      <label>Employer name <span style="color:var(--ink-soft);font-weight:400;">(optional)</span></label>
      <input id="setupEmployer" autocomplete="organization">
    </div>
    <div class="field">
      <label>Workplace / location <span style="color:var(--ink-soft);font-weight:400;">(optional)</span></label>
      <input id="setupWorkplace">
    </div>
    <button class="btn btn-primary" onclick="completeProfileSetup()">Start tracking</button>
  </div>
</div>

<!-- Main app -->
<div class="app hidden" id="appRoot">
  <div class="topbar">
    <div class="left">
      <div class="brand">WorkTrack</div>
      <div class="sub" id="topSub">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncLabel">WEEK OF —</span>
      </div>
    </div>
    <div class="right" id="topAvatar"></div>
  </div>
  <main id="main"></main>
  <nav>
    <button data-tab="dashboard" onclick="setTab('dashboard')"><span class="ic">⌂</span>Dashboard</button>
    <button data-tab="clock" onclick="setTab('clock')"><span class="ic">⏱</span>Clock</button>
    <button data-tab="history" onclick="setTab('history')"><span class="ic">▤</span>History</button>
    <button data-tab="payments" onclick="setTab('payments')"><span class="ic">$</span>Payments</button>
    <button data-tab="settings" onclick="setTab('settings')"><span class="ic">⚙</span>Settings</button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
// ──────────────────────────────────────────────
// Firebase init
// ──────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyAv7SxlzgPMduXfIDGm7Naai-9vqSBteHI",
  authDomain: "worktrack-2cc2c.firebaseapp.com",
  projectId: "worktrack-2cc2c",
  storageBucket: "worktrack-2cc2c.firebasestorage.app",
  messagingSenderId: "750750298477",
  appId: "1:750750298477:web:07cedff49caf836d556a64"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// Enable offline persistence (works on HTTPS / GitHub Pages)
db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

// ──────────────────────────────────────────────
// Local cache
// ──────────────────────────────────────────────
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); },
  remove(k){ localStorage.removeItem(k); }
};

// ──────────────────────────────────────────────
// App state
// ──────────────────────────────────────────────
let PROFILE     = { hourlyRate:24, weeklyLimit:25, employeeName:'', employerName:'', workplace:'' };
let ENTRIES     = [];
let PAYMENTS    = [];
let activeEntry = null;
let GOOGLE_USER = null;
let TAB         = 'dashboard';
let _unsubEntries = null, _unsubPayments = null;
let _synced = false;

// ──────────────────────────────────────────────
// Sync indicator
// ──────────────────────────────────────────────
function setSyncState(state){ // 'saving' | 'live' | 'offline'
  const dot   = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if(!dot) return;
  dot.className = 'sync-dot' + (state==='live'?' live':state==='saving'?' saving':'');
  if(state==='saving') label && (label.textContent = 'SAVING…');
  else if(state==='offline') label && (label.textContent = 'OFFLINE');
  else if(_synced) label && (label.textContent = `WEEK OF ${fmtDateShort(new Date(weekKey(new Date()))).toUpperCase()}`);
}

// ──────────────────────────────────────────────
// Toast
// ──────────────────────────────────────────────
let _toastTimer;
function toast(msg, ms=2500){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),ms);
}

// ──────────────────────────────────────────────
// Validation
// ──────────────────────────────────────────────
function fieldErr(id,msg){ const w=document.getElementById(id); if(!w) return; w.classList.add('has-err'); if(msg){ const e=w.querySelector('.err-msg'); if(e) e.textContent=msg; } }
function fieldOk(id){ const w=document.getElementById(id); if(w) w.classList.remove('has-err'); }
function validateRequired(fid,iid,msg){ const v=(document.getElementById(iid)||{}).value?.trim(); if(!v){ fieldErr(fid,msg); return false; } fieldOk(fid); return true; }
function validatePositive(fid,iid,msg){ const v=parseFloat((document.getElementById(iid)||{}).value); if(isNaN(v)||v<=0){ fieldErr(fid,msg); return false; } fieldOk(fid); return true; }

// ──────────────────────────────────────────────
// Screen management
// ──────────────────────────────────────────────
const SCREENS = ['loadingScreen','signInScreen','profileSetupScreen','appRoot'];
function showScreen(id){ SCREENS.forEach(s=>{ const el=document.getElementById(s); if(el) el.classList.toggle('hidden',s!==id); }); }

// ──────────────────────────────────────────────
// Auth
// ──────────────────────────────────────────────
async function signInWithGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  document.getElementById('signInError').classList.add('hidden');
  try {
    await auth.signInWithPopup(provider);
  } catch(e){
    const el=document.getElementById('signInError');
    el.textContent = e.message; el.classList.remove('hidden');
  }
}

async function signOut(){
  if(!confirm('Sign out of WorkTrack?')) return;
  clearListeners();
  await auth.signOut();
  GOOGLE_USER=null; ENTRIES=[]; PAYMENTS=[]; activeEntry=null; _synced=false;
  showScreen('signInScreen');
}

// ──────────────────────────────────────────────
// Firestore helpers
// ──────────────────────────────────────────────
function userRef(){ return db.collection('users').doc(auth.currentUser.uid); }

async function fsaveProfile(){
  setSyncState('saving');
  await userRef().set({ profile:PROFILE, activeEntry }, { merge:true });
  LS.set('wt_profile', PROFILE);
  setSyncState('live');
}
async function fsaveActive(){
  setSyncState('saving');
  await userRef().set({ activeEntry }, { merge:true });
  LS.set('wt_active', activeEntry);
  setSyncState('live');
}
async function fsaveEntry(entry){
  setSyncState('saving');
  await userRef().collection('entries').doc(entry.id).set(entry);
  setSyncState('live');
}
async function fdeleteEntry(id){
  setSyncState('saving');
  await userRef().collection('entries').doc(id).delete();
  setSyncState('live');
}
async function fsavePayment(payment){
  setSyncState('saving');
  await userRef().collection('payments').doc(payment.id).set(payment);
  setSyncState('live');
}

function clearListeners(){
  if(_unsubEntries){ _unsubEntries(); _unsubEntries=null; }
  if(_unsubPayments){ _unsubPayments(); _unsubPayments=null; }
}

// ──────────────────────────────────────────────
// Load user data + set up real-time listeners
// ──────────────────────────────────────────────
async function initUserData(uid){
  // Load profile & activeEntry from Firestore
  const snap = await userRef().get();
  if(snap.exists){
    const d = snap.data();
    if(d.profile)     PROFILE     = { ...PROFILE, ...d.profile };
    if(d.activeEntry) activeEntry = d.activeEntry;
  }
  LS.set('wt_profile', PROFILE);
  LS.set('wt_active',  activeEntry);

  // Real-time entries listener
  _unsubEntries = userRef().collection('entries')
    .orderBy('date','desc')
    .onSnapshot(snap=>{
      ENTRIES = snap.docs.map(d=>d.data());
      LS.set('wt_entries', ENTRIES);
      if(_synced) render();
    }, ()=>{ ENTRIES = LS.get('wt_entries')||[]; });

  // Real-time payments listener
  _unsubPayments = userRef().collection('payments')
    .onSnapshot(snap=>{
      PAYMENTS = snap.docs.map(d=>d.data());
      LS.set('wt_payments', PAYMENTS);
      if(_synced) render();
    }, ()=>{ PAYMENTS = LS.get('wt_payments')||[]; });
}

// ──────────────────────────────────────────────
// Auth state observer — single source of truth
// ──────────────────────────────────────────────
auth.onAuthStateChanged(async user=>{
  if(user){
    GOOGLE_USER = { name:user.displayName, email:user.email, picture:user.photoURL, uid:user.uid };
    await initUserData(user.uid);
    if(!PROFILE.employeeName){
      // First-time user — pre-fill name from Google
      const given = (user.displayName||'').split(' ')[0];
      document.getElementById('setupName').value = given;
      showScreen('profileSetupScreen');
    } else {
      showApp();
    }
  } else {
    showScreen('signInScreen');
  }
});

function showApp(){
  _synced = true;
  showScreen('appRoot');
  updateAvatar();
  setSyncState('live');
  setTab('dashboard');
}

function updateAvatar(){
  const el = document.getElementById('topAvatar');
  if(!el) return;
  if(GOOGLE_USER?.picture){
    el.innerHTML=`<img src="${GOOGLE_USER.picture}" alt="You" onclick="setTab('settings')" title="${GOOGLE_USER.email}">`;
  } else if(PROFILE.employeeName){
    el.innerHTML=`<div class="avatar-ph" onclick="setTab('settings')">${PROFILE.employeeName[0].toUpperCase()}</div>`;
  }
}

// ──────────────────────────────────────────────
// Profile setup
// ──────────────────────────────────────────────
async function completeProfileSetup(){
  const okName  = validateRequired('f-setupName','setupName','Your name is required');
  const okRate  = validatePositive('f-setupRate','setupRate','Enter a rate greater than 0');
  const okLimit = validatePositive('f-setupLimit','setupLimit','Enter hours greater than 0');
  if(!okName||!okRate||!okLimit) return;
  PROFILE.employeeName = document.getElementById('setupName').value.trim();
  PROFILE.hourlyRate   = parseFloat(document.getElementById('setupRate').value);
  PROFILE.weeklyLimit  = parseFloat(document.getElementById('setupLimit').value);

}

// ──────────────────────────────────────────────
// Date / week helpers
// ──────────────────────────────────────────────
function fmtDateShort(d){ return d.toLocaleDateString('en-NZ',{day:'2-digit',month:'short'}); }
function fmtDateLong(d){ return d.toLocaleDateString('en-NZ',{weekday:'long',day:'2-digit',month:'short'}); }
function startOfWeek(d){ const dt=new Date(d),day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function weekKey(d){ return startOfWeek(d).toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function entriesForWeek(ws){ return ENTRIES.filter(e=>e.date>=ws&&e.date<=addDays(ws,6)); }
function hoursToHM(h){ const hh=Math.floor(h),mm=Math.round((h-hh)*60); return mm===0?hh+'h':hh+'h '+mm+'m'; }
function fmtCoords(lat,lng){ return lat==null?'':lat.toFixed(5)+'°, '+lng.toFixed(5)+'°'; }

function calcWeek(ws){
  const list=entriesForWeek(ws).filter(e=>e.clockOut);
  const total=list.reduce((s,e)=>s+e.hoursWorked,0);
  const reg=Math.min(total,PROFILE.weeklyLimit),extra=Math.max(0,total-PROFILE.weeklyLimit);
  const earned=(reg+extra)*PROFILE.hourlyRate;
  const received=PAYMENTS.filter(p=>p.weekStart===ws).reduce((s,p)=>s+Number(p.amount),0);
  const outstanding=Math.max(0,earned-received);
  let status='Unpaid';
  if(received>=earned&&earned>0) status='Paid';
  else if(received>0) status='Partially Paid';
  return {total,reg,extra,earned,received,outstanding,status,entries:list};
}

// ──────────────────────────────────────────────
// Geolocation
// ──────────────────────────────────────────────
function getLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),
      ()=>resolve(null),{enableHighAccuracy:true,timeout:10000}
    );
  });
}

// ──────────────────────────────────────────────
// Clock in / out
// ──────────────────────────────────────────────
async function clockIn(){
  const btn=document.querySelector('.btn-clockin');
  if(btn){btn.disabled=true;btn.textContent='Getting location…';}
  const loc=await getLocation();
  const now=new Date();
  activeEntry={
    id:'e'+Date.now(),
    date:now.toISOString().slice(0,10),
    clockIn:now.toTimeString().slice(0,5),
    clockInTs:now.toISOString(),
    latIn:loc?loc.lat:null,lngIn:loc?loc.lng:null,accIn:loc?loc.acc:null,
    workplace:PROFILE.workplace||'',
    gpsIn:!!loc
  };
  await fsaveActive();
  render();
}

async function clockOut(){
  if(!activeEntry) return;
  const btn=document.querySelector('.btn-clockout');
  if(btn){btn.disabled=true;btn.textContent='Getting location…';}
  const loc=await getLocation();
  const now=new Date();
  const hours=Math.max(0,(now-new Date(activeEntry.clockInTs))/3600000);
  const entry={
    ...activeEntry,
    clockOut:now.toTimeString().slice(0,5),
    clockOutTs:now.toISOString(),
    latOut:loc?loc.lat:null,lngOut:loc?loc.lng:null,accOut:loc?loc.acc:null,
    gpsOut:!!loc,
    hoursWorked:Math.round(hours*100)/100
  };
  await fsaveEntry(entry);
  activeEntry=null;
  await fsaveActive();
  toast('Clocked out — '+hoursToHM(entry.hoursWorked)+' recorded');
  setTab('dashboard');
}

async function deleteEntry(id){
  if(!confirm('Delete this entry?')) return;
  await fdeleteEntry(id);
  render();
}

  };

function shareWeek(ws){
  const wk=calcWeek(ws);
  const days=wk.entries.map(e=>{
    const name=new Date(e.date+'T00:00:00').toLocaleDateString('en-NZ',{weekday:'long',day:'2-digit',month:'short'});
    const locIn =e.gpsIn ?fmtCoords(e.latIn,e.lngIn)+(e.accIn?` ±${e.accIn}m`:''):'GPS unavailable';
    const locOut=e.gpsOut?fmtCoords(e.latOut,e.lngOut)+(e.accOut?` ±${e.accOut}m`:''):'GPS unavailable';
    return `${name}\n  In:  ${e.clockIn}  |  ${e.workplace||'Workplace'} — ${locIn}\n  Out: ${e.clockOut} |  ${e.workplace||'Workplace'} — ${locOut}\n  Hours: ${hoursToHM(e.hoursWorked)}`;
  }).join('\n\n');
  const msg=`📋 Weekly Timesheet — WorkTrack\n\nEmployee: ${PROFILE.employeeName}\nEmployer: ${PROFILE.employerName||'—'}\nWeek: ${fmtDateShort(new Date(ws))} – ${fmtDateShort(new Date(addDays(ws,6)))}\n\n${days}\n\n──────────────────\nTotal Hours:   ${hoursToHM(wk.total)}\nRegular / Extra: ${hoursToHM(wk.reg)} / ${hoursToHM(wk.extra)}\nHourly Rate:   $${PROFILE.hourlyRate}/hr\nTotal Earned:  $${wk.earned.toFixed(2)}\n──────────────────`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function exportPDF(ws){
  const wk=calcWeek(ws);
  const rows=wk.entries.map(e=>{
    const locIn =e.gpsIn ?`${e.workplace||'Workplace'}<br><small>${fmtCoords(e.latIn,e.lngIn)}${e.accIn?` ±${e.accIn}m`:''}</small>`:(e.workplace||'—');
    const locOut=e.gpsOut?`${e.workplace||'Workplace'}<br><small>${fmtCoords(e.latOut,e.lngOut)}${e.accOut?` ±${e.accOut}m`:''}</small>`:(e.workplace||'—');
    return `<tr><td>${new Date(e.date+'T00:00:00').toLocaleDateString('en-NZ',{weekday:'short',day:'2-digit',month:'short'})}</td><td>${e.clockIn}<br><small>${locIn}</small></td><td>${e.clockOut}<br><small>${locOut}</small></td><td>${hoursToHM(e.hoursWorked)}</td><td style="color:${e.gpsIn&&e.gpsOut?'#1F8A70':'#999'}">${e.gpsIn&&e.gpsOut?'✅ Verified':'—'}</td></tr>`;
  }).join('');
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>WorkTrack – Weekly Report</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;padding:20px;color:#101C2C;max-width:700px;margin:0 auto;}h1{font-size:20px;}.meta{font-size:13px;color:#555;margin-bottom:16px;}table{width:100%;border-collapse:collapse;font-size:13px;}th{background:#101C2C;color:#fff;padding:9px 8px;text-align:left;}td{border-bottom:1px solid #e3ddcf;padding:9px 8px;vertical-align:top;}tr:nth-child(even) td{background:#f9f7f2;}small{font-size:11px;color:#555;}.sum{margin-top:20px;border:1px solid #e3ddcf;border-radius:10px;padding:14px;}.sum div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0ece3;font-size:14px;}.sum div:last-child{border-bottom:none;font-weight:700;}@media print{button{display:none;}}</style></head><body><h1>WorkTrack — Weekly Report</h1><div class="meta">Employee: <strong>${PROFILE.employeeName}</strong> &nbsp;|&nbsp; Employer: <strong>${PROFILE.employerName||'—'}</strong> &nbsp;|&nbsp; Workplace: <strong>${PROFILE.workplace||'—'}</strong><br>Week: ${fmtDateShort(new Date(ws))} – ${fmtDateShort(new Date(addDays(ws,6)))} &nbsp;|&nbsp; Rate: $${PROFILE.hourlyRate}/hr</div><table><tr><th>Date</th><th>Clock In &amp; Location</th><th>Clock Out &amp; Location</th><th>Hours</th><th>GPS</th></tr>${rows}</table><div class="sum"><div><span>Total Hours</span><span>${hoursToHM(wk.total)}</span></div><div><span>Regular / Extra</span><span>${hoursToHM(wk.reg)} / ${hoursToHM(wk.extra)}</span></div><div><span>Hourly Rate</span><span>$${PROFILE.hourlyRate}</span></div><div><span>Total Earned</span><span>$${wk.earned.toFixed(2)}</span></div><div><span>Received</span><span>$${wk.received.toFixed(2)}</span></div><div><span>Outstanding</span><span>$${wk.outstanding.toFixed(2)}</span></div><div><span>Status</span><span>${wk.status}</span></div></div><br><button onclick="window.print()" style="padding:10px 20px;font-size:14px;cursor:pointer;">Print / Save PDF</button></body></html>`);
  w.document.close();
}

// ──────────────────────────────────────────────
// Tabs / render
// ──────────────────────────────────────────────
function setTab(t){ TAB=t; render(); }
function pillClass(s){ return s==='Paid'?'pill-paid':s==='Partially Paid'?'pill-partial':'pill-unpaid'; }

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===TAB));
  const m=document.getElementById('main');
  if(!m) return;
  const curWS=weekKey(new Date());
  document.getElementById('syncLabel').textContent=`WEEK OF ${fmtDateShort(new Date(curWS)).toUpperCase()}`;
  if(TAB==='dashboard') return renderDashboard(m,curWS);
  if(TAB==='clock')     return renderClock(m);
  if(TAB==='history')   return renderHistory(m);
  if(TAB==='payments')  return renderPayments(m,curWS);
  if(TAB==='settings')  return renderSettings(m);
}

  const wk=calcWeek(curWS);
  const pct=Math.min(100,(wk.total/PROFILE.weeklyLimit)*100);
  const over=wk.total>PROFILE.weeklyLimit;
  const todayISO=new Date().toISOString().slice(0,10);
  const todayCount=ENTRIES.filter(e=>e.date===todayISO&&e.clockOut).length;
  m.innerHTML=`
    ${activeEntry?`<div class="clocked-in-banner"><div class="gps-dot ${activeEntry.gpsIn?'':'off'}"></div><div class="info"><div class="time">Clocked in — ${activeEntry.clockIn}</div><div class="sub">${activeEntry.gpsIn?'GPS captured':'GPS unavailable'} · Tap Clock tab to finish</div></div></div>`:''}
    <div class="hero">
      <div class="label">Current week</div>
      <div class="big">${hoursToHM(wk.total)} <small>/ ${PROFILE.weeklyLimit}h</small></div>
      <div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      <div style="color:#A9B4C4;font-size:12px;">${over?'Over limit by '+hoursToHM(wk.total-PROFILE.weeklyLimit):hoursToHM(Math.max(0,PROFILE.weeklyLimit-wk.total))+' remaining'}</div>
      <div class="hero-grid">
        <div class="hero-cell"><div class="l">REGULAR</div><div class="v">${hoursToHM(wk.reg)}</div></div>
        <div class="hero-cell"><div class="l">EXTRA</div><div class="v">${hoursToHM(wk.extra)}</div></div>
        <div class="hero-cell"><div class="l">RATE</div><div class="v">$${PROFILE.hourlyRate}/hr</div></div>
        <div class="hero-cell"><div class="l">ESTIMATED</div><div class="v">$${wk.earned.toFixed(2)}</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Payment — this week</h2>
      <div class="stat-row"><div class="l">Earned</div><div class="v">$${wk.earned.toFixed(2)}</div></div>
      <div class="stat-row"><div class="l">Received</div><div class="v">$${wk.received.toFixed(2)}</div></div>
      <div class="stat-row"><div class="l">Outstanding</div><div class="v">$${wk.outstanding.toFixed(2)}</div></div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px;">

        <button class="btn btn-ghost" onclick="exportPDF('${curWS}')">PDF Report</button>

      <h2>${activeEntry?'You\'re clocked in':'Ready to clock in'}</h2>

        <div class="tag-line"><span class="gps-dot ${activeEntry.gpsIn?'':'off'}"></span><span class="muted">Clocked in at <strong>${activeEntry.clockIn}</strong>${activeEntry.gpsIn?' · GPS verified ✅':' · GPS unavailable'}</span></div>
        ${activeEntry.gpsIn?`<div class="muted" style="margin-bottom:12px;font-size:11.5px;">📍 ${fmtCoords(activeEntry.latIn,activeEntry.lngIn)}${activeEntry.accIn?' ±'+activeEntry.accIn+'m':''}</div>`:''}
        <button class="btn btn-clockout" onclick="clockOut()">Clock Out</button>
      `:`
        <div class="muted" style="margin-bottom:14px;">Records your start time and GPS at ${PROFILE.workplace||'your workplace'}.</div>

    <div class="card">
      <h2>Today — ${new Date().toLocaleDateString('en-NZ',{weekday:'long',day:'2-digit',month:'short'})}</h2>

function renderHistory(m){
  const weekStarts=[...new Set(ENTRIES.map(e=>weekKey(new Date(e.date+'T00:00:00'))))].sort().reverse();
  if(!weekStarts.length){ m.innerHTML=`<div class="card"><div class="empty">No history yet. Clock in to start.</div></div>`; return; }
  m.innerHTML=weekStarts.map(ws=>{
    const wk=calcWeek(ws);
    const rows=wk.entries.map(e=>`
      <div class="entry-row">
        <div class="d">${fmtDateLong(new Date(e.date+'T00:00:00'))} · ${hoursToHM(e.hoursWorked)}</div>
        <div class="t">${e.clockIn} – ${e.clockOut}</div>
        ${e.gpsIn?`<div class="loc"><span class="gps-dot"></span> In: ${fmtCoords(e.latIn,e.lngIn)}${e.accIn?' ±'+e.accIn+'m':''}</div>`:''}
        ${e.gpsOut?`<div class="loc"><span class="gps-dot"></span> Out: ${fmtCoords(e.latOut,e.lngOut)}${e.accOut?' ±'+e.accOut+'m':''}</div>`:''}
      </div>`).join('');
    return `<div class="card week-card">
      <div class="head"><div class="wk">${fmtDateShort(new Date(ws))} – ${fmtDateShort(new Date(addDays(ws,6)))}</div><span class="pill ${pillClass(wk.status)}">${wk.status}</span></div>
      <div class="stat-row"><div class="l">Hours</div><div class="v">${hoursToHM(wk.total)}</div></div>
      <div class="stat-row"><div class="l">Earned</div><div class="v">$${wk.earned.toFixed(2)}</div></div>
      <div class="stat-row"><div class="l">Outstanding</div><div class="v">$${wk.outstanding.toFixed(2)}</div></div>
      <details style="margin-top:10px;"><summary style="font-size:13px;color:var(--ink-soft);cursor:pointer;padding:4px 0;">Show daily entries</summary><div style="margin-top:8px;">${rows||'<div class="empty" style="padding:16px 0;">No completed entries.</div>'}</div></details>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-gold" style="font-size:13px;padding:12px;" onclick="shareWeek('${ws}')">WhatsApp</button>
        <button class="btn btn-ghost" style="font-size:13px;padding:12px;" onclick="exportPDF('${ws}')">PDF</button>
      </div>
    </div>`;
  }).join('')+renderMonthlySummary();
}

function renderMonthlySummary(){
  const today=new Date(),label=today.toLocaleDateString('en-NZ',{month:'long',year:'numeric'});
  const me=ENTRIES.filter(e=>{ const d=new Date(e.date+'T00:00:00'); return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear()&&e.clockOut; });
  const totalH=me.reduce((s,e)=>s+e.hoursWorked,0);
  const wss=[...new Set(me.map(e=>weekKey(new Date(e.date+'T00:00:00'))))];
  let earned=0,received=0;
  wss.forEach(ws=>{ const wk=calcWeek(ws); earned+=wk.earned; received+=wk.received; });
  return `<div class="card"><h2>Monthly summary — ${label}</h2>
    <div class="stat-row"><div class="l">Total Hours</div><div class="v">${hoursToHM(totalH)}</div></div>
    <div class="stat-row"><div class="l">Total Earned</div><div class="v">$${earned.toFixed(2)}</div></div>
    <div class="stat-row"><div class="l">Received</div><div class="v">$${received.toFixed(2)}</div></div>
    <div class="stat-row"><div class="l">Outstanding</div><div class="v">$${Math.max(0,earned-received).toFixed(2)}</div></div>
  </div>`;
}

function renderPayments(m,curWS){
  const wss=[...new Set(ENTRIES.map(e=>weekKey(new Date(e.date+'T00:00:00'))))];
  if(!wss.includes(curWS)) wss.push(curWS);
  wss.sort().reverse();
  m.innerHTML=wss.map(ws=>{
    const wk=calcWeek(ws);
    const pays=PAYMENTS.filter(p=>p.weekStart===ws);
    return `<div class="card">
      <div class="head"><div class="wk">${fmtDateShort(new Date(ws))} – ${fmtDateShort(new Date(addDays(ws,6)))}</div><span class="pill ${pillClass(wk.status)}">${wk.status}</span></div>
      <div class="stat-row"><div class="l">Earned</div><div class="v">$${wk.earned.toFixed(2)}</div></div>
      <div class="stat-row"><div class="l">Received</div><div class="v">$${wk.received.toFixed(2)}</div></div>
      <div class="stat-row"><div class="l">Outstanding</div><div class="v">$${wk.outstanding.toFixed(2)}</div></div>
      ${pays.length?`<div style="margin-top:8px;">${pays.map(p=>`<div class="entry-row"><div class="d">$${Number(p.amount).toFixed(2)}</div><div class="t">${p.date}${p.note?' · '+p.note:''}</div></div>`).join('')}</div>`:''}
      <button class="btn btn-ghost" style="margin-top:12px;" onclick="openPaymentModal('${ws}')">+ Add payment</button>
    </div>`;
  }).join('');
}

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        ${GOOGLE_USER?.picture?`<img src="${GOOGLE_USER.picture}" style="width:44px;height:44px;border-radius:50%;border:2px solid var(--line);">`:''}
        <div><div style="font-weight:600;font-size:14px;">${GOOGLE_USER?.name||PROFILE.employeeName}</div><div class="muted">${GOOGLE_USER?.email||''}</div></div>
      </div>
      <div class="muted" style="margin-bottom:12px;">All data syncs automatically across your devices via Firestore.</div>
      <button class="btn btn-danger" onclick="signOut()">Sign out</button>
    </div>
    <div class="card">
      <h2>Danger zone</h2>
      <button class="btn btn-danger" onclick="clearAllData()">Delete all my data</button>
    </div>`;
}

async function saveSettings(){
  const okName  = validateRequired('f-setName','setName','Name is required');
  const okRate  = validatePositive('f-setRate','setRate','Enter a rate greater than 0');
  const okLimit = validatePositive('f-setLimit','setLimit','Enter hours greater than 0');
  if(!okName||!okRate||!okLimit) return;
  PROFILE.employeeName = document.getElementById('setName').value.trim();
  PROFILE.employerName = document.getElementById('setEmployer').value.trim();
  PROFILE.workplace    = document.getElementById('setWorkplace').value.trim();
  PROFILE.hourlyRate   = parseFloat(document.getElementById('setRate').value);
  PROFILE.weeklyLimit  = parseFloat(document.getElementById('setLimit').value);
  await fsaveProfile();
  updateAvatar();
  const msg=document.getElementById('savedMsg'); msg.textContent='Saved ✓';
  setTimeout(()=>msg.textContent='',2000);
}

async function clearAllData(){
  if(!confirm('Delete ALL your entries, payments, and settings from the cloud? This cannot be undone.')) return;
  const uid=auth.currentUser?.uid; if(!uid) return;
  // Delete all entries
  const entries=await userRef().collection('entries').get();
  const batch=db.batch();
  entries.docs.forEach(d=>batch.delete(d.ref));
  // Delete all payments
  const payments=await userRef().collection('payments').get();
  payments.docs.forEach(d=>batch.delete(d.ref));
  // Reset profile
  batch.set(userRef(),{ profile:{ hourlyRate:24,weeklyLimit:25,employeeName:'',employerName:'',workplace:'' }, activeEntry:null });
  await batch.commit();
  toast('All data deleted');
  ENTRIES=[]; PAYMENTS=[]; activeEntry=null;
  PROFILE={ hourlyRate:24, weeklyLimit:25, employeeName:'', employerName:'', workplace:'' };
  clearListeners();
  await auth.signOut();
  showScreen('signInScreen');
}
</script>
</body>
